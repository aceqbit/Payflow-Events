name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build, unit tests, outbox contract equality (V1 == docs/contract/outbox.sql)
        run: mvn -B -ntp verify
      - name: Schema compatibility (BACKWARD) against the registered baseline
        run: python3 scripts/check-schema-compat.py
      - name: Prometheus rules and alert unit tests
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability/prometheus:/p" prom/prometheus:v3.1.0 \
            check rules /p/rules/events.yml /p/rules/alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/observability/prometheus:/p" -w /p/tests prom/prometheus:v3.1.0 \
            test rules alerts_test.yml
      - name: Dashboards are regenerated byte for byte from perf/gen_dashboards.py
        run: |
          python3 perf/gen_dashboards.py
          git diff --exit-code deploy/observability/grafana/dashboards

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Testcontainers: real Kafka and Postgres. Idempotency, ordering, relay contract, verifier fixtures, restart test.
      - name: Integration tests with the JaCoCo gate
        run: mvn -B -ntp verify -Pit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failsafe-reports
          path: "**/target/failsafe-reports/**"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco
          path: "**/target/site/jacoco/**"

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-and-unit, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Jib images to GHCR (tagged 1.0.0 and the commit SHA)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp -DskipTests package jib:build \
            -pl relay-poller,consumer,rollup-streams,verifier,generator,source-app,dual-write-app -am \
            -Djib.to.auth.username="$GHCR_USER" -Djib.to.auth.password="$GHCR_TOKEN" \
            -Djib.to.tags="${GITHUB_SHA::12}"
