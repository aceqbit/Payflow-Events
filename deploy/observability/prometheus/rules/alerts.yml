# The twelve alerts of plan section 6, expressions and durations exactly as written. Prometheus rule format so promtool
# can unit-test them (deploy/observability/prometheus/tests/alerts_test.yml).
groups:
  - name: payflow-alerts
    rules:
      - alert: LostEvents
        expr: max(payflow_verifier_lost_events{relay!="dual-write"}) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "Verifier counted lost events on an outbox run"}
      - alert: DuplicateEffects
        expr: max(payflow_verifier_duplicate_effects) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "More than one effect for one event id"}
      - alert: OrderViolations
        expr: increase(payflow_events_order_violations_total[5m]) > 0
        for: 0m
        labels: {severity: critical}
        annotations: {summary: "Gap or reversal in per-aggregate order"}
      - alert: VerifierStale
        expr: time() - max(payflow_verifier_last_run_timestamp_seconds) > 86400
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "No verifier run in 24 h"}
      - alert: ConsumerLagHigh
        expr: events:max_lag_seconds > 30
        for: 2m
        labels: {severity: page}
        annotations: {summary: "Consumer lag above 30 s"}
      - alert: LatencyFastBurn
        expr: (1 - events:sli_latency_200ms:1h) > 14.4 * 0.01 and (1 - events:sli_latency_200ms:5m) > 14.4 * 0.01
        for: 2m
        labels: {severity: page}
        annotations: {summary: "Latency SLO burning at more than 14.4x"}
      - alert: DLQReceiving
        expr: sum(increase(payflow_events_retry_total{stage="dlq"}[5m])) > 0
        for: 5m
        labels: {severity: warning}
        annotations: {summary: "Events are reaching the DLQ"}
      - alert: DLQNotReplayed
        expr: sum(kafka_consumer_group_lag{group="dlq-replay"}) > 0
        for: 30m
        labels: {severity: ticket}
        annotations: {summary: "DLQ has unreplayed events"}
      - alert: DebeziumBehind
        expr: max(debezium_metrics_millisecondsbehindsource) > 10000
        for: 2m
        labels: {severity: page}
        annotations: {summary: "Debezium more than 10 s behind the source"}
      - alert: ReplicationSlotLag
        expr: max(pg_replication_slot_lag_bytes) > 1e9
        for: 5m
        labels: {severity: page}
        annotations: {summary: "Replication slot retains more than 1 GB of WAL"}
      - alert: OutboxBacklogOld
        expr: max(pg_outbox_oldest_unpublished_seconds) > 30
        for: 2m
        labels: {severity: page}
        annotations: {summary: "Oldest unpublished outbox row older than 30 s"}
      - alert: UnderReplicated
        expr: sum(kafka_server_replicamanager_underreplicatedpartitions{scenario!~"chaos.*"}) > 0
        for: 1m
        labels: {severity: page}
        annotations: {summary: "Under-replicated partitions outside a chaos run"}
