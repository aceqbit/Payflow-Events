# Produces debezium_metrics_* names from plan section 5.
lowercaseOutputName: true
lowercaseOutputLabelNames: true
rules:
  - pattern: 'debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^>]+)><>(MilliSecondsBehindSource|QueueRemainingCapacity|TotalNumberOfEventsSeen|MilliSecondsSinceLastEvent)'
    name: debezium_metrics_$4
    labels: {plugin: "$1", context: "$2", server: "$3"}
    type: GAUGE
